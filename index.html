        function updateProgress() {
            const total = reactionsData.length;

                            ${rx.id === 5 ? 'Ar-X + R-X + 2Na ──(dry ether)──> Ar-R + 2NaX' : ''}

                            ${rx.id === 7 ? 'Ar-N2⁺X⁻ ──(Cu / HX)──> Ar-X + N2 + CuX' : ''}
